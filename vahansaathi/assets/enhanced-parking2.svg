<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Modern Building/Garage -->
  <g transform="translate(50,50)">
    <!-- Building Structure -->
    <path d="M0 100 L150 0 L300 100 V300 H0 Z" fill="#ffffff" filter="url(#shadow)"/>
    
    <!-- Windows -->
    <rect x="20" y="120" width="40" height="40" rx="5" fill="#e9ecef"/>
    <rect x="70" y="120" width="40" height="40" rx="5" fill="#e9ecef"/>
    <rect x="190" y="120" width="40" height="40" rx="5" fill="#e9ecef"/>
    <rect x="240" y="120" width="40" height="40" rx="5" fill="#e9ecef"/>

    <!-- Garage Door -->
    <path d="M40 300 V180 H260 V300" fill="#f8f9fa" stroke="#dee2e6"/>
    <g fill="none" stroke="#dee2e6">
      <path d="M40 200 H260"/>
      <path d="M40 220 H260"/>
      <path d="M40 240 H260"/>
      <path d="M40 260 H260"/>
      <path d="M40 280 H260"/>
    </g>

    <!-- Car Inside -->
    <g transform="translate(80,220)">
      <!-- Car Body -->
      <path d="M0 40 L20 10 H120 L140 40" fill="#0d6efd"/>
      <rect x="20" y="40" width="100" height="30" fill="#0d6efd"/>
      <!-- Windows -->
      <path d="M30 15 H110 L120 35 H20 Z" fill="#198754" opacity="0.5"/>
      <!-- Wheels -->
      <circle cx="40" cy="70" r="10" fill="#212529"/>
      <circle cx="100" cy="70" r="10" fill="#212529"/>
    </g>
  </g>

  <!-- Share/Earn Elements -->
  <g transform="translate(300,80)">
    <circle r="40" fill="#198754"/>
    <text x="-30" y="5" font-family="Arial" font-size="14" fill="white">SHARE</text>
    <text x="-30" y="25" font-family="Arial" font-size="14" fill="white">& EARN</text>
  </g>

  <!-- Coins Animation -->
  <g transform="translate(280,150)">
    <g transform="rotate(-15)">
      <circle r="20" fill="#ffc107"/>
      <text x="-5" y="5" font-family="Arial" font-size="14" fill="white">₹</text>
    </g>
    <g transform="translate(30,-10) rotate(15)">
      <circle r="20" fill="#198754"/>
      <text x="-5" y="5" font-family="Arial" font-size="14" fill="white">P</text>
    </g>
  </g>

  <!-- Benefits Cards -->
  <g transform="translate(50,320)">
    <!-- Earning Card -->
    <rect width="90" height="60" rx="10" fill="white" filter="url(#shadow)"/>
    <text x="10" y="30" font-family="Arial" font-size="12" fill="#6c757d">Earn</text>
    <text x="10" y="50" font-family="Arial" font-size="16" fill="#198754">₹500/day</text>

    <!-- Points Card -->
    <g transform="translate(110,0)">
      <rect width="90" height="60" rx="10" fill="white" filter="url(#shadow)"/>
      <text x="10" y="30" font-family="Arial" font-size="12" fill="#6c757d">Get</text>
      <text x="10" y="50" font-family="Arial" font-size="16" fill="#0d6efd">100 pts</text>
    </g>

    <!-- Community Card -->
    <g transform="translate(220,0)">
      <rect width="90" height="60" rx="10" fill="white" filter="url(#shadow)"/>
      <text x="10" y="30" font-family="Arial" font-size="12" fill="#6c757d">Help</text>
      <text x="10" y="50" font-family="Arial" font-size="16" fill="#dc3545">Community</text>
    </g>
  </g>

  <!-- Shadow Filter -->
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
</svg>
