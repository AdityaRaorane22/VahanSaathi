<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f8f9fa" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="#ffffff"/>
  <rect width="400" height="400" fill="url(#grid)"/>

  <!-- Rewards Hub Circle -->
  <g transform="translate(200,200)">
    <!-- Outer Ring -->
    <circle r="150" fill="#f8f9fa"/>
    <circle r="140" fill="#ffffff"/>

    <!-- Animated Reward Points -->
    <g>
      <!-- Point 1 -->
      <g transform="rotate(0)">
        <g transform="translate(0,-100)">
          <circle r="25" fill="#198754"/>
          <text x="-15" y="5" font-family="Arial" font-size="14" fill="white">+50</text>
        </g>
      </g>
      
      <!-- Point 2 -->
      <g transform="rotate(72)">
        <g transform="translate(0,-100)">
          <circle r="25" fill="#0d6efd"/>
          <text x="-15" y="5" font-family="Arial" font-size="14" fill="white">+20</text>
        </g>
      </g>
      
      <!-- Point 3 -->
      <g transform="rotate(144)">
        <g transform="translate(0,-100)">
          <circle r="25" fill="#dc3545"/>
          <text x="-15" y="5" font-family="Arial" font-size="14" fill="white">+30</text>
        </g>
      </g>
      
      <!-- Point 4 -->
      <g transform="rotate(216)">
        <g transform="translate(0,-100)">
          <circle r="25" fill="#ffc107"/>
          <text x="-15" y="5" font-family="Arial" font-size="14" fill="white">+40</text>
        </g>
      </g>
      
      <!-- Point 5 -->
      <g transform="rotate(288)">
        <g transform="translate(0,-100)">
          <circle r="25" fill="#198754"/>
          <text x="-15" y="5" font-family="Arial" font-size="14" fill="white">+60</text>
        </g>
      </g>
    </g>

    <!-- Center Medal -->
    <circle r="50" fill="#ffc107"/>
    <circle r="45" fill="#198754"/>
    <text x="-30" y="10" font-family="Arial" font-size="24" fill="white">200</text>
    <text x="-25" y="25" font-family="Arial" font-size="12" fill="white">POINTS</text>
  </g>

  <!-- Achievement Cards -->
  <g transform="translate(20,20)">
    <!-- Daily Streak -->
    <rect width="100" height="80" rx="10" fill="white" filter="url(#shadow)"/>
    <text x="10" y="30" font-family="Arial" font-size="12" fill="#6c757d">Streak</text>
    <text x="10" y="55" font-family="Arial" font-size="20" fill="#198754">7 Days</text>
    
    <!-- Level -->
    <g transform="translate(120,0)">
      <rect width="100" height="80" rx="10" fill="white" filter="url(#shadow)"/>
      <text x="10" y="30" font-family="Arial" font-size="12" fill="#6c757d">Level</text>
      <text x="10" y="55" font-family="Arial" font-size="20" fill="#0d6efd">Pro</text>
    </g>
  </g>

  <!-- Rewards Progress -->
  <g transform="translate(20,300)