<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Layered Background -->
  <defs>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e9ecef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dee2e6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Map Background with Grid -->
  <rect width="400" height="400" fill="#f8f9fa"/>
  <rect x="20" y="20" width="360" height="360" rx="20" fill="url(#mapGrad)"/>
  
  <!-- Grid Lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.3">
    <path d="M20 140 H380"/>
    <path d="M20 260 H380"/>
    <path d="M140 20 V380"/>
    <path d="M260 20 V380"/>
  </g>

  <!-- Main Roads -->
  <path d="M50 200 H350" stroke="#ffffff" stroke-width="30"/>
  <path d="M200 50 V350" stroke="#ffffff" stroke-width="30"/>
  
  <!-- Road Markings -->
  <path d="M50 200 H350" stroke="#dee2e6" stroke-width="2" stroke-dasharray="10,10"/>
  <path d="M200 50 V350" stroke="#dee2e6" stroke-width="2" stroke-dasharray="10,10"/>

  <!-- Current Location Pulse Effect -->
  <circle cx="200" cy="200" r="50" fill="#0d6efd" opacity="0.1">
    <animate attributeName="r" values="40;60;40" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.2;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="200" r="30" fill="#0d6efd" opacity="0.2"/>
  <circle cx="200" cy="200" r="15" fill="#0d6efd"/>
  <circle cx="200" cy="200" r="8" fill="#ffffff"/>

  <!-- Parking Spots with Labels -->
  <g>
    <!-- Official Spots -->
    <g transform="translate(150,150)">
      <circle r="15" fill="#198754"/>
      <text x="-7" y="5" font-family="Arial" font-size="14" fill="white">P1</text>
      <circle r="25" fill="#198754" opacity="0.1"/>
    </g>
    
    <g transform="translate(250,250)">
      <circle r="15" fill="#198754"/>
      <text x="-7" y="5" font-family="Arial" font-size="14" fill="white">P2</text>
      <circle r="25" fill="#198754" opacity="0.1"/>
    </g>

    <!-- Community Spots -->
    <g transform="translate(150,250)">
      <circle r="15" fill="#0d6efd"/>
      <text x="-7" y="5" font-family="Arial" font-size="14" fill="white">C1</text>
      <circle r="25" fill="#0d6efd" opacity="0.1"/>
    </g>
  </g>

  <!-- Search Bar -->
  <rect x="70" y="40" width="260" height="40" rx="20" fill="white" filter="url(#shadow)"/>
  <text x="90" y="65" font-family="Arial" font-size="14" fill="#6c757d">Search nearby parking...</text>
  <circle cx="300" cy="60" r="12" fill="#198754"/>
  <path d="M296 60 L304 60 M300 56 V64" stroke="white" stroke-width="2"/>

  <!-- Distance Indicators -->
  <g>
    <rect x="70" y="320" width="100" height="30" rx="15" fill="white" opacity="0.9"/>
    <text x="85" y="340" font-family="Arial" font-size="12">200m radius</text>
    
    <rect x="230" y="320" width="100" height="30" rx="15" fill="white" opacity="0.9"/>
    <text x="245" y="340" font-family="Arial" font-size="12">4 spots found</text>
  </g>

  <!-- 200m Radius Circle -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#198754" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Filters -->
  <g transform="translate(320,100)">
    <rect width="40" height="40" rx="10" fill="white"/>
    <line x1="10" y1="15" x2="30" y2="15" stroke="#6c757d" stroke-width="2"/>
    <line x1="10" y1="20" x2="30" y2="20" stroke="#6c757d" stroke-width="2"/>
    <line x1="10" y1="25" x2="30" y2="25" stroke="#6c757d" stroke-width="2"/>
  </g>

  <!-- Shadow Filter -->
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
</svg>
